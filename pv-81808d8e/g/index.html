<script>
(function(){var v=function(s){return /^%%/.test(s)?'':s},API=v('https://script.google.com/macros/s/AKfycbw5Klo1YLrsJe_aLt5TnMqTTDV8JXAOFtrUd53f0x1ABgoE8t2qYG9IAcMGrh9XkyUi/exec'),WHO=v('담당 상담사 김성태')||'담당 상담사',TEL=(v('010-8315-9602')||'').replace(/\D/g,'');

 if(!j||!j.ok){err(j&&j.why==='old'?'링크 기간(60일)이 지났습니다':'자료를 찾지 못했습니다');return}
