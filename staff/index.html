<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>상담 데스크 · 상동역 롯데캐슬 시그니처</title>

<script src="deskx.js"></script>
<style>
:root{--bg:#F6F3EE;--surface:#fff;--surface2:#FBF9F5;--ink:#0F1729;--muted:#5E6677;--line:#E6E0D5;--line2:#D9D1C3;--navy:#0F1729;--navy-ink:#F5F1E8;--gold:#7A4F00;--gold2:#E8B547;--gold-soft:#FBE7B5;--gold-ink:#4A2E00;--rust:#A4432F;
--sh1:0 1px 2px rgba(15,23,41,.05),0 6px 20px rgba(15,23,41,.06);--sh2:0 2px 4px rgba(15,23,41,.06),0 18px 40px rgba(15,23,41,.10);--serif:'Noto Serif KR',Georgia,serif;--sans:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}p{margin:0}a{color:inherit}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.brand{background:var(--navy);color:var(--navy-ink);border-bottom:1px solid rgba(232,181,71,.35);padding-top:env(safe-area-inset-top,0px)}
.brand-in{max-width:1240px;margin:0 auto;padding:12px max(20px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand .bn{font-family:var(--serif);font-weight:700;font-size:16px}.brand .bn i{font-style:normal;color:var(--gold2);margin-right:8px}
.brand .bt{font-size:12px;letter-spacing:.22em;color:var(--gold2);font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700}.eyebrow::before{content:"";width:28px;height:1.5px;background:var(--gold)}
.sub{color:var(--muted);margin-top:6px}.note{font-size:13px;color:var(--muted);margin-top:12px}
.btn{border:none;border-radius:12px;min-height:48px;padding:0 20px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--navy);color:var(--navy-ink)}.btn-s{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.btn-g{background:linear-gradient(135deg,#F2C14E,#C98A12);color:#1A1306;box-shadow:0 8px 20px rgba(201,138,18,.28)}
.btn:disabled{opacity:.5}
/* lock */
.lock{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--sh2)}
.lockbox h1{font-size:28px;margin-top:10px}
.lockbox label{display:block;font-size:13px;font-weight:700;margin-top:20px}
.lockbox input[type=password]{width:100%;font:inherit;font-size:18px;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);margin-top:6px;letter-spacing:.1em}
.lockbox .rem{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;color:var(--muted);margin-top:14px}
.lockbox .rem input{width:20px;height:20px;accent-color:var(--navy)}
.lockbox .btn{width:100%;margin-top:18px}
.err{color:var(--rust);font-size:14px;font-weight:700;margin-top:10px;min-height:22px}
/* hub */
.htop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.htop h1{font-size:clamp(30px,4vw,44px);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh1);transition:transform .18s,box-shadow .18s,border-color .18s;min-height:190px}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--gold2)}
.card .no{font-family:var(--serif);font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.1em}
.card .k{font-size:12px;color:var(--muted);font-weight:700}
.card b{font-family:var(--serif);font-size:22px;line-height:1.3}
.card .d{font-size:14px;color:var(--muted)}
.card em{font-style:normal;color:var(--gold-ink);font-weight:700}
.card .go{margin-top:auto;font-weight:700;font-size:14px;color:var(--gold-ink)}
.card.hero{grid-column:1/-1;background:linear-gradient(135deg,#0F1729,#1C2846);border-color:#0F1729;color:#F5F1E8;min-height:170px}
.card.hero .k,.card.hero .d{color:rgba(245,241,232,.75)}.card.hero b{font-size:26px;color:#fff}.card.hero em{color:#E5CB98}.card.hero .go{color:#E5CB98}
@media (min-width:1000px){.card.hero{grid-column:span 2}}
.send{display:grid;grid-template-columns:220px 1fr;gap:28px;margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--sh1)}
.qrbox{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.qrbox img{width:100%;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:#fff}
.send h2{font-size:24px;margin-top:6px}
.links{display:grid;gap:10px;margin-top:16px}
.lk{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.lk b{display:block;font-family:var(--serif);font-size:17px}.lk span{font-size:13px;color:var(--muted);word-break:break-all}
.lk .acts,.row{display:flex;gap:8px;flex-wrap:wrap}.row{margin-top:14px}
.subok{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:#1F6F5C;background:#DDF1E9;border-radius:999px;padding:4px 12px}
.hacts{display:flex;gap:8px;flex-wrap:wrap}
.guidebar{display:block;margin-top:16px;padding:14px 18px;border-radius:14px;background:var(--navy);color:#F5F1E8;text-decoration:none;font-size:15px}.guidebar b{color:#F2C14E;margin-right:10px}
.grp{margin-top:22px;border-radius:24px;padding:20px 20px 22px}
.grp.cust{background:#FFF6DE;border:2px solid #E8B547}
.grp.staff{background:#FBEDEA;border:2px solid #C8553D}
.gh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gb{font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;color:#fff}
.cust .gb{background:#8F5E0A}.staff .gb{background:#A4432F}
.gh p{color:var(--muted);font-size:14px}
.grp .cards{margin-top:14px}
.cust .card .no{color:#8F5E0A}
.staff .card{border-left:6px solid #A4432F}.staff .card .no{color:#A4432F}.staff .card .go{color:#A4432F}
.grp .send{margin-top:16px}
.guide{display:grid;gap:16px;margin-top:22px}
.gs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh1);align-items:start}
.gs:not(:has(.gim)){grid-template-columns:1fr}
.gn{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#F2C14E;font-weight:800;align-items:center;justify-content:center;font-size:15px}
.gs h2{font-size:22px;margin-top:8px}.gs ol,.gs ul{margin:10px 0 0;padding-left:20px}.gs li{margin:6px 0}.gs p{margin-top:8px;color:var(--muted)}
.gim img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.k1,.k2{display:inline-block;font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;margin-right:6px}.k1{background:#8F5E0A}.k2{background:#A4432F}
.gt{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}.gt th,.gt td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.gt td:first-child{white-space:nowrap;font-weight:700}
.warn li{color:var(--rust);font-weight:600}
@media (max-width:820px){.gs{grid-template-columns:1fr}}
.btoc{position:sticky;top:0;z-index:3;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--sh1);display:flex;gap:12px;align-items:center;overflow-x:auto;scrollbar-width:none}.btoc::-webkit-scrollbar{display:none}
.btoc b{flex:none;font-size:14px;color:var(--muted)}.btoc ol{display:flex;gap:6px;margin:0;padding:0;list-style:none;counter-reset:t}.btoc li{flex:none;counter-increment:t}
.btoc a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}.btoc a::before{content:counter(t,decimal);display:none}
.bguide{display:grid;gap:26px;margin-top:22px;font-size:17.5px;line-height:1.7}
.bpart{scroll-margin-top:90px}
.bno{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:12px;background:var(--navy);color:#F2C14E;font-weight:800;font-size:20px;padding:0 10px}
.bpart>h2{font-size:clamp(24px,3vw,30px);margin-top:10px}.blead{color:var(--muted);margin-top:6px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px;box-shadow:var(--sh1)}
.bcard h3{font-size:21px;margin-bottom:6px}.bcard>p{margin-top:6px}
.do{margin:10px 0 0;padding:0;list-style:none;counter-reset:d}.do li{counter-increment:d;position:relative;padding:10px 0 10px 48px;border-bottom:1px dashed var(--line)}
.do li::before{content:counter(d);position:absolute;left:0;top:9px;width:34px;height:34px;border-radius:50%;background:#1F6F5C;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.bfig{margin:16px 0 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface2)}
.bfig img{display:block;width:100%;height:auto;background:#fff}.bfig.phone{max-width:360px}.bfig.mid{max-width:560px}.bfig figcaption{font-size:14px;font-weight:700;color:var(--muted);padding:10px 14px 0}
.mks{list-style:none;margin:0;padding:8px 14px 14px;display:grid;gap:6px}.mks li{font-size:15.5px;display:flex;gap:8px;align-items:flex-start}
.mk{flex:none;display:inline-flex;width:26px;height:26px;border-radius:50%;background:#E5262C;color:#fff;font-size:14px;font-weight:800;align-items:center;justify-content:center;margin-top:1px}
.say,.bwarn,.btip{margin-top:14px;border-radius:14px;padding:14px 16px}.say span,.bwarn span,.btip span{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff}
.say{background:#EAF2FF;border:1.5px solid #3B6FD8}.say span{background:#3B6FD8}.say p{margin-top:8px;font-size:18px;color:#143A7A}
.bwarn{background:#FBEDEA;border:1.5px solid #C8553D}.bwarn span{background:#A4432F}.bwarn p{margin-top:8px;color:#7A2A1C}
.btip{background:#E8F4EE;border:1.5px solid #1F6F5C}.btip span{background:#1F6F5C}.btip p{margin-top:8px;color:#174D40}
.excust{background:var(--navy);color:#F5F1E8;border-radius:20px;padding:18px 22px}.excust b{color:#F2C14E;font-size:18px}.excust ul{margin:8px 0 0;padding-left:20px}
.twofig{display:flex;gap:14px;flex-wrap:wrap}
.chk{margin:8px 0 0;padding-left:0;list-style:none}.chk li{padding:6px 0 6px 30px;position:relative}.chk li::before{content:"✓";position:absolute;left:4px;color:#1F6F5C;font-weight:800}
.faq{display:grid;gap:8px;margin-top:14px}.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.faq summary{cursor:pointer;font-weight:800;min-height:52px;display:flex;align-items:center}.faq p{margin:0 0 14px;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{list-style:none;margin:8px 0 0;padding:0}.box li{padding:8px 0 8px 34px;position:relative;border-bottom:1px dashed var(--line)}.box li::before{content:"";position:absolute;left:2px;top:11px;width:20px;height:20px;border:2px solid var(--line2);border-radius:5px}
.warn.big li{font-size:17px;margin:8px 0}
.bend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.kitsec{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh1)}.kitsec h2{font-size:22px}
.kt{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface2)}.kh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.kh b{font-family:var(--serif);font-size:18px}.kh span{font-size:13px;color:var(--muted)}
.ktx{margin:10px 0 12px;font-size:15px;line-height:1.6;word-break:break-all}.kt .acts{display:flex;gap:8px;flex-wrap:wrap}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}.qri{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface2)}
.qri img{width:100%;aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line)}.qri b{font-size:16px}.qri span{font-size:13px;color:var(--muted)}.sm{font-size:13px;color:var(--muted)}
.tips{margin-top:22px;padding:20px 24px;border-radius:20px;border:1px dashed var(--line2)}
.tips h3{font-size:18px}.tips ol{margin:10px 0 0;padding-left:20px;color:var(--muted)}.tips li{margin:4px 0}.tips b{color:var(--ink)}
@media (max-width:700px){.send{grid-template-columns:1fr}.qrbox{max-width:240px}}
/* viewer */
.vtop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.vtop>div{flex:1;min-width:240px}.vtop h1{font-size:clamp(26px,3.4vw,36px);margin-top:6px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none;color:var(--gold-ink);width:100%}
.pages{display:grid;gap:18px;margin-top:22px}
.pages.page{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.pg{margin:0}.pg img{display:block;width:100%;height:auto;min-height:120px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh1);cursor:zoom-in}
.pg figcaption{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
@media (max-width:520px){.pages.page{grid-template-columns:1fr}}
/* present */
.pv{position:fixed;inset:0;z-index:50;background:#05070C;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.pv img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-select:none}
.pv .bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.7));color:#F5F1E8;font-size:14px;opacity:1;transition:opacity .3s}
.pv.quiet .bar{opacity:0}
.pv .bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;min-height:44px;padding:0 16px;font-weight:700;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:12px 20px;border-radius:12px;font-size:14px;z-index:60;border:1px solid rgba(232,181,71,.4);box-shadow:var(--sh2)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style></head><body>
<div class="brand"><div class="brand-in"><span class="bn"><i>◆</i>상동역 롯데캐슬 시그니처</span><span class="bt">상담 데스크</span></div></div>
<div id="root"><p class="loading">여는 중…</p></div>
<script>
(function(){
var PAGES={hub:1,v1:1,v2:1,sc:1,cd:1,sim:1,consult:1,guide:1,basic:1,kit:1,admin:1,edu:1,qa:1,set:1,stat:1};
var DCFG={api:'',sid:'OWNER'}, RAW=null, W=null;
var te=new TextEncoder(), td=new TextDecoder();
var K=null, KEY=null, $=function(q){return document.querySelector(q)};
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function ub64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function sget(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k)}catch(e){return null}}
function sset(k,v,rem){try{(rem?localStorage:sessionStorage).setItem(k,v)}catch(e){}}
function sdel(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}
function toast(t){var o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(function(){o.remove()},2600)}
async function dec(buf){var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))}
async function fetchDec(path){var r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error('missing');return dec(await r.arrayBuffer())}
async function unwrap(pw,w){var base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.salt),iterations:w.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var u=b64(w.wrap);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},kek,u.slice(12)))}
async function useRaw(raw){RAW=raw;KEY=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']);return check()}
function hasApi(){return /^https?:\/\//.test(DCFG.api)}
// 비밀번호를 바꿨으면 웹앱에 새 열쇠 감싸기가 있음 (없거나 연결이 안 되면 이 태블릿에 저장된 것 → 기본)
async function pickWrap(){var base={salt:K.salt,iter:K.iter,wrap:K.wrap,kid:K.kid},c=null;try{c=JSON.parse(localStorage.getItem('sig-kw')||'null')}catch(e){}
  if(c&&c.kid!==K.kid)c=null;
  if(hasApi()){try{var ac=new AbortController();setTimeout(function(){ac.abort()},5000);var j=await (await fetch(DCFG.api+'?op=kw&sid='+encodeURIComponent(DCFG.sid),{signal:ac.signal,cache:'no-store'})).json();
    if(j&&j.ok&&!j.none&&j.kid===K.kid){c={kid:j.kid,salt:j.salt,iter:j.iter,wrap:j.wrap};try{localStorage.setItem('sig-kw',JSON.stringify(c))}catch(e){}}}catch(e){}}
  return c||base}
function deskObj(){window.DESK={cfg:DCFG,K:K,get raw(){return RAW},toast:toast,copy:copy,
  verify:async function(pw){try{var r=await unwrap(pw,W||await pickWrap());return r.length===RAW.length&&r.every(function(x,i){return x===RAW[i]})}catch(e){return false}},
  auth:async function(){var k=await crypto.subtle.importKey('raw',RAW,{name:'HMAC',hash:'SHA-256'},false,['sign']);var sg=new Uint8Array(await crypto.subtle.sign('HMAC',k,te.encode('sig-auth|'+DCFG.sid)));return Array.prototype.map.call(sg,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}}}
async function check(){try{var p=await dec(b64(K.chk));return td.decode(p)==='sig-ok'}catch(e){return false}}
function page(){var m=/[?&]p=([a-z0-9]+)/.exec(location.search);return m&&PAGES[m[1]]?m[1]:'hub'}

function lockView(msg){
  $('#root').innerHTML='<div class="lock"><form class="lockbox" id="lf" autocomplete="off"><p class="eyebrow">상담사 전용</p><h1>상담 데스크</h1><p class="sub">상담자료 · 상담 모드는 암호를 넣어야 열립니다.</p>'+
  '<label for="pw">암호</label><input id="pw" type="password" autocomplete="current-password" enterkeyhint="go">'+
  '<label class="rem"><input type="checkbox" id="rem" checked> 이 태블릿에서 기억하기 (내 태블릿에서만)</label>'+
  '<p class="err" id="er">'+(msg||'')+'</p><button class="btn btn-p" id="ok">열기</button></form></div>';
  $('#lf').addEventListener('submit',async function(e){e.preventDefault();var b=$('#ok');b.disabled=true;b.textContent='확인 중…';
    var raw=null;try{W=await pickWrap();raw=await unwrap($('#pw').value,W)}catch(err){raw=null}
    try{if(!raw||!(await useRaw(raw))){KEY=null;RAW=null;$('#er').textContent='암호가 맞지 않습니다';b.disabled=false;b.textContent='열기';return}
      sset('sig-staff-k',K.kid+'|'+ub64(raw),$('#rem').checked);deskObj();show()}
    catch(err){$('#er').textContent='이 브라우저에서는 열 수 없습니다. 크롬 최신 버전으로 열어 주세요';b.disabled=false;b.textContent='열기'}});
  setTimeout(function(){var p=$('#pw');if(p)p.focus()},50);
}
async function hydrate(){
  var imgs=[].slice.call(document.querySelectorAll('img[data-enc]'));var i=0;
  async function one(){while(i<imgs.length){var im=imgs[i++];try{var buf=await fetchDec(im.dataset.enc);
    im.src=URL.createObjectURL(new Blob([buf],{type:/qr/.test(im.dataset.enc)?'image/png':'image/jpeg'}))}catch(e){im.alt='이미지를 열지 못했습니다'}}}
  await Promise.all([one(),one(),one(),one()]);
}
async function show(){
  var p=page();
  if(window.DESKX){
    if(p==='edu'||p==='qa'||p==='set'||(p==='stat'&&DCFG.sid==='OWNER')){$('#root').innerHTML='';DESKX[p]($('#root'));return}
    if(!DESKX.trained()){$('#root').innerHTML='';DESKX.edu($('#root'),'first');return}
  }
  try{
    var html=td.decode(await fetchDec(p+'.enc'));
    if(p==='sim'||p==='consult'){document.open();document.write(html);document.close();return}
    $('#root').innerHTML=(SUBRES?SIGSUB.banner(SUBRES):'')+'<main class="wrap">'+html+'</main>';window.scrollTo(0,0);hydrate();
    var hh=$('.htop h1'); if(hh&&SUBRES&&SUBRES.ok) hh.insertAdjacentHTML('afterend','<p class="subok">구독 중 · '+SUBRES.sub.until.replace(/-/g,'.')+'까지</p>');
    if(p==='hub'&&window.DESKX) DESKX.hubDecor();
  }catch(e){ if(e&&e.message==='missing'){$('#root').innerHTML='<main class="wrap"><p class="loading">자료를 찾지 못했습니다. <a href="./">상담 데스크로</a></p></main>'} else {sdel('sig-staff-k');KEY=null;lockView('암호가 바뀌었습니다. 새 암호를 넣어 주세요')} }
}
/* present mode */
function present(start){
  var srcs=[].slice.call(document.querySelectorAll('.pg img')).map(function(x){return x.src}).filter(Boolean);if(!srcs.length)return;
  var i=Math.max(0,start||0),o=document.createElement('div');o.className='pv';o.setAttribute('role','dialog');o.setAttribute('aria-label','발표 모드');
  o.innerHTML='<img alt=""><div class="bar"><button data-x="prev">‹ 이전</button><span class="cnt"></span><span style="display:flex;gap:8px"><button data-x="next">다음 ›</button><button data-x="close">닫기 ✕</button></span></div>';
  document.body.appendChild(o);var im=o.querySelector('img'),cnt=o.querySelector('.cnt'),qt;
  function draw(){im.src=srcs[i];cnt.textContent=(i+1)+' / '+srcs.length;o.classList.remove('quiet');clearTimeout(qt);qt=setTimeout(function(){o.classList.add('quiet')},2500)}
  function go(d){i=Math.min(srcs.length-1,Math.max(0,i+d));draw()}
  function close(){document.removeEventListener('keydown',kd);o.remove();try{if(document.fullscreenElement||document.webkitFullscreenElement){var r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(r&&r.catch)r.catch(function(){})}}catch(e){}}
  function kd(e){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')go(1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);else if(e.key==='Escape')close()}
  document.addEventListener('keydown',kd);
  o.addEventListener('click',function(e){var x=e.target.closest('[data-x]');if(x){var a=x.dataset.x;if(a==='close')close();else go(a==='next'?1:-1);return}
    if(e.clientX<innerWidth*0.33)go(-1);else go(1)});
  var sx=null;o.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  o.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){e.preventDefault();go(dx<0?1:-1)}});
  try{var rf=o.requestFullscreen||o.webkitRequestFullscreen;if(rf){var q=rf.call(o);if(q&&q.catch)q.catch(function(){})}}catch(e){}
  draw();
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('복사했습니다')}catch(e){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했습니다')}catch(_){toast(t)}a.remove()}}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b){var g=e.target.closest('.pg img');if(g){present([].slice.call(document.querySelectorAll('.pg img')).indexOf(g))}return}
  var a=b.dataset.act;
  if(a==='present')present(0);
  if(a==='qr'){var q=$('.qrbox img');if(q&&q.src){var o=document.createElement('div');o.className='pv';o.style.background='#fff';o.innerHTML='<img alt="방문고객용 QR" style="width:min(80vw,80vh);height:auto"><div class="bar" style="background:none"><span style="color:#0F1729;font-weight:700">휴대폰 카메라로 찍어 주세요</span><button data-x="close" style="background:#0F1729">닫기 ✕</button></div>';o.querySelector('img').src=q.src;o.addEventListener('click',function(){o.remove()});document.body.appendChild(o)}}
  if(a==='copy')copy(b.dataset.url);
  if(a==='dlimg'){var im=document.getElementById(b.dataset.for);if(im&&im.src){var l=document.createElement('a');l.href=im.src;l.download=b.dataset.name||'qr.png';document.body.appendChild(l);l.click();l.remove();}return}
  if(a==='share'){var t=b.dataset.text||'[상동역 롯데캐슬 시그니처] (주)디어입니다. 우리 가족 집 알아보기 안내를 보내 드립니다.';
    var st=b.dataset.stop;if(navigator.share){navigator.share(st?{title:'상동역 롯데캐슬 시그니처',text:t+' '+b.dataset.url+'\n'+st}:{title:'상동역 롯데캐슬 시그니처',text:t,url:b.dataset.url}).catch(function(){})}else copy(t+' '+b.dataset.url+(st?'\n'+st:''))}
  if(a==='next'){try{localStorage.removeItem('sig-lead');localStorage.removeItem('hosil')}catch(_){}toast('앞 고객 기록을 지웠습니다. 다음 고객을 맞이하세요')}
  if(a==='lock'){sdel('sig-staff-k');KEY=null;lockView('잠갔습니다')}
});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
var SUBRES=null;
(async function(){
  if(!window.SIGSUB){ $('#root').innerHTML='<p class="loading">인터넷에 연결한 뒤 다시 열어 주세요</p>'; return; }
  try{ SUBRES=await SIGSUB.check(); }catch(e){ SUBRES={ok:false,why:'first'}; }
  if(!SUBRES.ok){ $('#root').innerHTML=SIGSUB.screen(SUBRES); return; }
  try{K=await (await fetch('k.json',{cache:'no-cache'})).json()}catch(e){$('#root').innerHTML='<p class="loading">연결을 확인해 주세요</p>';return}
  if(!window.crypto||!crypto.subtle){lockView('이 브라우저에서는 열 수 없습니다');return}
  var s=sget('sig-staff-k');
  if(s&&s.split('|')[0]===K.kid){try{if(await useRaw(b64(s.split('|')[1]))){deskObj();return show()}}catch(e){}}
  sdel('sig-staff-k');lockView();
})();
})();
