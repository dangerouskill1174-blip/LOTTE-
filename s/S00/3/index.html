<style>
/* Layout: brand bar, step progress line, then a two-column body on wide screens (selection column + sticky "우리 집 사양" summary); on phones and portrait tablets the summary becomes the fixed bottom price bar. */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface2:#FBF9F5; --ink:#0F1729; --muted:#5E6677; --line:#E6E0D5; --line2:#D9D1C3;
  --navy:#0F1729; --navy2:#1C2846; --navy-ink:#F5F1E8; --gold:#7A4F00; --gold2:#C98A12; --gold-soft:#FBE3A6; --gold-ink:#4A2E00;
  --green:#4F7A55; --green-soft:#E6EFE6; --rust:#A4432F; --rust-soft:#F7E6E0;
  --sh1:0 1px 2px rgba(15,23,41,.05),0 6px 20px rgba(15,23,41,.06); --sh2:0 2px 4px rgba(15,23,41,.06),0 18px 40px rgba(15,23,41,.10);
  --serif:'Noto Serif KR', Georgia, serif; --sans:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-bottom:120px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;color:var(--ink);letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* brand */
.brand{background:var(--navy);color:var(--navy-ink);border-bottom:1px solid rgba(232,181,71,.35);padding-top:env(safe-area-inset-top,0px)}
.brand-in{max-width:1240px;margin:0 auto;padding:12px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .bn{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.02em}
.brand .bn i{font-style:normal;color:var(--gold2);margin-right:8px}
.brand .bt{font-size:12px;letter-spacing:.22em;color:var(--gold2);font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
/* step progress */
.rail{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail-in::-webkit-scrollbar{display:none}
.pill{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;position:relative;font-size:12px;color:var(--muted);font-weight:500;padding:0 4px;text-align:center}
.pill b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surface);border:1.5px solid var(--line2);color:var(--muted);position:relative;z-index:1;font-family:var(--sans)}
.pill::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:1.5px;background:var(--line2)}
.pill:first-child::before{display:none}
.pill.done{color:var(--gold-ink)}
.pill.done b{background:var(--gold);border-color:var(--gold);color:#fff}
.pill.done::before,.pill.on::before{background:var(--gold)}
.pill.on{color:var(--ink);font-weight:700}
.pill.on b{background:var(--navy);border-color:var(--navy);color:var(--gold2);box-shadow:0 0 0 4px var(--gold-soft)}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:26px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--gold2);color:var(--gold-ink);animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
/* body layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.side{display:none}
@media (min-width:1024px){
  .layout{grid-template-columns:minmax(0,1fr) 360px}
  .side{display:block;position:sticky;top:96px;margin-top:22px}
  .picks{display:none}
  .pbar{display:none}
  body{padding-bottom:40px}
}
.step.still{animation:none}
.opt.sel::after{display:none!important}
.step{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3.4vw,40px);box-shadow:var(--sh1);animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.eyebrow::before{content:"";width:28px;height:1.5px;background:var(--gold)}
.q{font-size:clamp(25px,3.2vw,36px);margin-top:10px;line-height:1.25}
.q2{font-size:21px;margin-top:34px}
.sub{color:var(--muted);margin-top:10px;max-width:66ch}
.pickone{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:999px;padding:4px 12px}
.grid{display:grid;gap:14px;margin-top:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.opt{position:relative;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:border-color .18s,transform .18s,box-shadow .18s;box-shadow:var(--sh1)}
.opt:hover{border-color:var(--gold2);transform:translateY(-2px);box-shadow:var(--sh2)}
.opt.sel{border:2px solid var(--navy);background:#FFF4D6;padding-top:44px;box-shadow:0 0 0 4px rgba(242,193,78,.45),var(--sh2)}
.opt.sel::before{content:"✓ 선택됨";position:absolute;left:0;right:0;top:0;height:32px;background:var(--navy);color:#F2C14E;font-size:14px;font-weight:800;display:flex;align-items:center;padding-left:16px;border-radius:16px 16px 0 0;letter-spacing:.04em}
.opt.sel::after{display:none;content:"✓";position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--gold2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.opt.dim{opacity:.45}
.opt .t{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.3;padding-right:24px}
.opt .k{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.opt .d{font-size:15px;color:var(--muted)}
.opt img{width:100%;height:160px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line);margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin:0 4px 3px 0}
.t6{background:var(--navy);color:var(--gold2)}
.t4{background:var(--rust-soft);color:var(--rust)}
.tg{background:var(--green-soft);color:var(--green)}
.tgold{background:var(--gold-soft);color:var(--gold-ink)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:30px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;min-height:50px;padding:0 22px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--navy);color:var(--navy-ink);box-shadow:0 8px 20px rgba(15,23,41,.18)}
.btn-p:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;transform:none}
.btn-s{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.btn-g{background:linear-gradient(135deg,#F2C14E,#C98A12);color:#1A1306;box-shadow:0 8px 20px rgba(201,138,18,.28)}
.note{font-size:13px;color:var(--muted);margin-top:16px}
/* intro */
.hero{padding:44px 0 6px}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.12}
.hero .lead{font-size:18px;color:var(--muted);margin-top:16px;max-width:52ch}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:26px}
.path span{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1)}
/* map */
.map{display:grid;grid-template-columns:1fr minmax(64px,120px) 1fr;gap:12px;margin-top:16px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tower{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;transition:border-color .18s,transform .18s,box-shadow .18s;box-shadow:var(--sh1)}
.tower:hover{transform:translateY(-2px);border-color:var(--gold2)}
.tower.rec{background:linear-gradient(160deg,#FFF1CC,#F6D88A);border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(232,181,71,.35),var(--sh2)}
.tower.sel,.tower.rec.sel{background:linear-gradient(160deg,#1C2846,#0F1729);border:3px solid #F2C14E;box-shadow:0 0 0 4px rgba(242,193,78,.45),var(--sh2)}
.tower.sel .n{color:#fff}.tower.sel .tg2{color:rgba(245,241,232,.8)!important}
.tower.sel::after{content:"✓ 선택됨";position:absolute;left:12px;top:-12px;background:#F2C14E;color:#0F1729;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.tower.dim{opacity:.4}
.tower .n{font-family:var(--serif);font-size:23px;font-weight:700}
.tower .tg2{font-size:13px;color:var(--muted)}

.tower .c{font-size:13px;margin-top:6px}
.ribbon{position:absolute;top:-10px;right:10px;background:linear-gradient(135deg,#E0A12A,#A8690A);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(156,118,57,.35);letter-spacing:.04em}
.garden{background:linear-gradient(180deg,var(--green-soft),#DCE9DB);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:10px 6px;text-align:center;color:var(--green);font-size:12px;font-weight:700}
.park{border:1.5px dashed var(--green);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--green)}
.dirs{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:16px;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-size:15px;transition:all .15s}
.pchip::before{content:"";width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);background:var(--surface);flex:none}
.pchip.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.pchip.on::before{content:"✓";border-color:var(--gold2);background:var(--gold2);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
/* type detail */
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}
.detail img{width:100%;align-self:start;background:#fff;border-radius:12px;border:1px solid var(--line)}
.atbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.atbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.atbl td:last-child{text-align:right;font-weight:700}
.big-n{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1.1}
/* line cards */
.line{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center}
.compass{width:84px;height:84px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px}
.pbarv{margin-top:6px}
.pbarv .bar{height:10px}
.pbarv small{font-size:12px;color:var(--muted)}
/* charts */
.chart{margin-top:20px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface2)}
.chart h4{margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--gold-ink)}
.hbar{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .tr{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:8px}
.hbar b{font-variant-numeric:tabular-nums;white-space:nowrap}
.stack{display:flex;height:44px;border-radius:12px;overflow:hidden;font-size:13px;font-weight:700}
.stack div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 6px}
.stack .s1{background:var(--navy);color:var(--gold2)}
.stack .s2{background:linear-gradient(135deg,#F2C14E,#C98A12);color:#1A1306}

.slegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}

.tl{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px;padding-top:26px}
.tl::before{content:"";position:absolute;left:6%;right:6%;top:31px;height:2px;background:var(--line2)}
.tl div{position:relative;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.35}
.tl div::before{content:"";display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 8px;background:var(--surface);border:2px solid var(--gold);position:relative;z-index:1}
.tl div.k::before{background:var(--navy);border-color:var(--navy)}
.tl div.e::before{background:var(--gold);border-color:var(--gold)}
.tl b{display:block;color:var(--ink);font-size:12px}
/* result */
.res-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.kv{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kv .l{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}

.kv.hl{background:var(--navy);border-color:var(--navy)}
.kv.hl .l{color:var(--gold2)}
.kv.hl .v{color:#fff}
.money{width:100%;border-collapse:collapse;margin-top:18px;font-variant-numeric:tabular-nums}

.money td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.money tr.tot td{font-size:19px;color:var(--ink);border-bottom:none;padding-top:14px}

  if(a==='pinok'){ const v=$('#pin').value; if(v!==PIN){toast('비밀번호가 맞지 않습니다');return;} STAFF_DRAFT={asof:ASOF||new Date().toISOString().slice(0,10),lines:JSON.parse(JSON.stringify(AV||{}))}; S.staff=true; render(); window.scrollTo({top:0}); }

  const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>우리 가족 시그니처 사양서</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap"><style>body{margin:0;background:#fff}</style></head><body>${body}</body></html>`;
  const dl=await getDL(); if(!dl){ toast('이 화면에서는 저장할 수 없습니다. 확인서를 화면으로 보여 주세요'); return; }
  try{ await dl.save({filename:fileBase()+'.html',data:doc}); toast('저장했습니다. 파일을 열어 인쇄하세요'); }
  catch(err){ if(err&&err.code==='declined') return; toast('저장하지 못했습니다'); }
}
function loadH2C(){ return new Promise((res,rej)=>{ if(window.html2canvas) return res(window.html2canvas); const s=document.createElement('script'); s.src='../assets/html2canvas.min.js'; s.onload=()=>res(window.html2canvas); s.onerror=rej; document.head.appendChild(s); }); }
async function savePNG(btn){
  const list=listForSheet(); if(!list.length){toast('먼저 호실을 골라 주세요');return;}
  if(window.GATE && !GATE.ok()){ GATE.open(()=>savePNG(btn),'사양서 이미지를 저장하려면 성함과 연락처를 남겨 주세요'); return; }
  btn.disabled=true; const old=btn.textContent; btn.textContent='만드는 중…';
  const box=document.createElement('div'); box.style.cssText='position:absolute;left:-12000px;top:0;width:794px;pointer-events:none'; document.body.appendChild(box);
  try{
    const h2c=await loadH2C(); if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const items=[];
    for(let i=0;i<list.length;i++){
      btn.textContent=`만드는 중… ${i+1}/${list.length}`;
      box.innerHTML=sheetHTML(i); const sh=box.querySelector('.sh');
      await Promise.all([...sh.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
      const cv=await h2c(sh,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123,windowWidth:1100,scrollX:0,scrollY:0});
      items.push({blob:await new Promise(r=>cv.toBlob(r,'image/png')),name:fileBase(i)+'.png',label:(i+1)+'순위'});
    }
    await deliverPNG(items);
    if(window.GATE) GATE.notify('사양서 이미지 저장');
  }catch(err){ if(!(err&&err.code==='declined')) toast('이미지를 만들지 못했습니다. 인쇄 저장을 이용해 주세요'); }
  finally{ box.remove(); btn.disabled=false; btn.textContent=old; }
}
async function deliverPNG(items){ showImgs(items); }

// ---------- 현황판 연결 ----------
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    DB=db; USER=user;
    CAN = user ? await user.canEdit() : false;

    if(db && CAN){
      db.doc('board/current').onSnapshot(snap=>{
        if(snap.exists){ const v=snap.data(); AV=v.lines||null; ASOF=v.asof||''; }
        if(!S.staff && [2,3,4,5].includes(S.step)) render();
      },()=>{});
    }
  }catch(e){}
})();
const SHEETVIEW=/[?&]view=sheet/.test(location.search);
const GATE=window.GATE=(function(){
  const ok=()=>!!(window.SIG&&SIG.lead());
  const ranks=()=>listForSheet().map((x,i)=>{ try{ const k=calc(x); return (i+1)+'순위 '+x.dong+'동 '+x.ho+'호 '+x.type+' '+bandName(k.l,k.b)+' '+eok(k.P); }catch(e){ return ''; } }).filter(Boolean).join(' / ');
  function close(){ const o=document.getElementById('gate'); if(o) o.remove(); }
  function open(cb,why){
    close(); const o=document.createElement('div'); o.id='gate'; o.className='gate';
    o.innerHTML=`<form class="gate-in" novalidate><p class="eyebrow">나만의 시그니처 만들기 · 시작 전 한 번</p><h2>성함과 연락처를 남겨 주세요</h2>
<p class="sub">${why||'남겨 주시면 바로 시작됩니다.'} 고른 호실은 담당 ${CONTACT.who}에게 전달되어 계약 가능 여부를 알려 드립니다.</p>
<div class="gate-f"><label class="field" for="gnm">성함<input id="gnm" autocomplete="name" required></label><label class="field" for="gtl">연락처<input id="gtl" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required></label></div>
<div class="gate-pv"><b>개인정보 수집 · 이용 안내</b><ul><li>수집하는 곳: 상동역 롯데캐슬 시그니처 분양 ${CONTACT.who} (${CONTACT.tel})</li><li>목적: 나만의 시그니처 열람, 고른 호실의 계약 가능 여부 회신과 분양 상담 연락</li><li>항목: 성함, 연락처 (고른 호실 정보가 함께 전달됩니다)</li><li>보유 기간: 수집일부터 6개월, 이후 즉시 파기 · 제3자 제공 없음</li><li><b>동의하지 않으셔도 됩니다.</b> 이 경우 휴대폰 화면은 열리지 않지만 전화 상담이나 종이 사양서로 같은 내용을 안내받으실 수 있습니다.</li></ul></div>
<label class="gate-ck"><input type="checkbox" id="gc1"><span><b>[필수]</b> 위 개인정보 수집 · 이용에 동의합니다</span></label>
<label class="gate-ck"><input type="checkbox" id="gc2"><span>[선택] 분양 소식 문자 수신에 동의합니다 (오전 9시~오후 6시, 언제든 수신거부)</span></label>
<p class="gate-err" id="gerr" role="alert"></p>
<div class="gate-b"><button class="btn btn-g" type="submit" id="ggo">동의하고 시작하기</button><button class="btn btn-s" type="button" data-gx>다음에 할게요</button><a class="btn btn-s" style="text-decoration:none" href="tel:${CONTACT.raw}">전화 상담</a></div></form>`;
    document.body.appendChild(o);
    const f=o.querySelector('form'), er=o.querySelector('#gerr');
    o.querySelector('[data-gx]').onclick=close;
    if(S.info.cust) o.querySelector('#gnm').value=S.info.cust;
    f.addEventListener('submit',async e=>{ e.preventDefault();
      const n=o.querySelector('#gnm').value.trim(), t=o.querySelector('#gtl').value.trim();
      if(!n){ er.textContent='성함을 적어 주세요'; return; }
      if(!SIG.validTel(t)){ er.textContent='연락처를 확인해 주세요 (예: 010-1234-5678)'; return; }
      if(!o.querySelector('#gc1').checked){ er.textContent='[필수] 개인정보 수집 · 이용에 동의하셔야 시작할 수 있습니다'; return; }
      er.textContent=''; const b=o.querySelector('#ggo'); b.disabled=true; b.textContent='보내는 중…';
      const rk=ranks(); const memo=[SMEMO, rk?'[후보] '+rk:''].filter(Boolean).join(' / ');
      await SIG.register({name:n,tel:SIG.fmtTel(t),mkt:o.querySelector('#gc2').checked,interest:rk?'사양서 열람 · '+rk.split(' / ')[0]:'나만의 시그니처 만들기 시작',memo});
      S.info.cust=n; save(); close(); toast('등록되었습니다 · '+CONTACT.who+'에게 전달했습니다'); if(cb) cb(); });
    setTimeout(()=>{ const x=o.querySelector('#gnm'); if(x&&!x.value) x.focus(); },60);
  }
  function notify(kind){ if(!ok()) return; const rk=ranks(); if(!rk) return; const key=kind+'|'+candCode();
    let sent=[]; try{ sent=JSON.parse(localStorage.getItem('hosil-sent')||'[]'); }catch(e){}
    if(sent.includes(key)) return; const L=SIG.lead();
    SIG.submit({name:L.name,tel:L.tel,interest:kind+' · '+rk.split(' / ')[0],memo:'['+kind+'] '+rk});
    sent.push(key); try{ localStorage.setItem('hosil-sent',JSON.stringify(sent.slice(-20))); }catch(e){} }
  return {ok,open,notify,close};
})();
function sheetView(){
  const list=listForSheet(); document.documentElement.classList.add('sv');
  const fl=new URL('../flyer/',location.href).href, self=simBase()+'?from=sheet&c='+candCode();
  const r=document.createElement('div'); r.className='svroot';
  r.innerHTML=list.length?`<div class="svbar"><div class="svt"><b>우리 가족 시그니처 사양서</b><span>1 · 2 · 3순위 · A4 ${list.length}장 · 상동역 롯데캐슬 시그니처</span></div><div class="svb"><button class="btn btn-g" type="button" id="svp">인쇄 · PDF 저장</button><a class="btn btn-p" style="text-decoration:none" href="${self}">휴대폰에서 직접 골라 보기</a><a class="btn btn-s svw" style="text-decoration:none" href="${fl}">단지 안내 전단</a></div><p class="svpv">‘직접 골라 보기’는 성함 · 연락처와 개인정보 동의 후 열립니다. 원하지 않으시면 이 사양서만 보셔도 됩니다.</p></div><div class="svpages">${list.map((x,i)=>`<div class="svpg">${sheetHTML(i)}</div>`).join('')}</div>`
   :`<div class="svbar"><div class="svt"><b>사양서를 찾지 못했습니다</b><span>링크가 잘렸을 수 있습니다. 상담팀장에게 다시 받아 주세요 · ${CONTACT.who} ${CONTACT.tel}</span></div></div>`;
  document.body.appendChild(r);
  const fit=()=>{ const w=Math.min(innerWidth,document.documentElement.clientWidth||innerWidth); const z=w<820?Math.max(.3,(w-16)/794):1; r.querySelectorAll('.svpg').forEach(p=>p.style.zoom=z); };
  fit(); addEventListener('resize',fit); addEventListener('beforeprint',()=>r.querySelectorAll('.svpg').forEach(p=>p.style.zoom=1)); addEventListener('afterprint',fit);
  const pb=r.querySelector('#svp'); if(pb) pb.onclick=()=>window.print();
  document.title='우리 가족 시그니처 사양서 · 상동역 롯데캐슬 시그니처';
}
if(SHEETVIEW) sheetView(); else { if(!GATE.ok()&&S.step>0){ const pend=S.step; S.step=0; setTimeout(()=>GATE.open(()=>go(pend),'상담에서 고른 후보를 보시려면 성함과 연락처를 남겨 주세요'),250); } render(); }
