<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow">
<title>질문 답변 · 상동역 롯데캐슬 시그니처</title>
<meta property="og:title" content="남겨 주신 질문의 답변 · 상동역 롯데캐슬 시그니처"><meta property="og:description" content="담당 상담사가 답변을 드렸습니다"><meta property="og:image" content="https://dangerouskill1174-blip.github.io/LOTTE-/s/S01/assets/og.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700&display=swap">
<script src="../assets/sig.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F0EA;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;color:#141B2D;word-break:keep-all;line-height:1.6}
.top{background:#141B2D;color:#F5F1E8;padding:16px max(16px,env(safe-area-inset-left,0px)) 18px}
.top p{margin:0;font-size:12.5px;letter-spacing:.12em;color:#E8C77A;font-weight:800}.top h1{margin:4px 0 0;font-family:'Noto Serif KR',serif;font-size:24px}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 140px}
.card{background:#fff;border:1px solid #E3DCCF;border-radius:16px;padding:18px 18px;margin-top:14px}
.lb{font-size:12.5px;font-weight:800;color:#8A5A00;letter-spacing:.06em}
.q{white-space:pre-wrap;font-size:16.5px;margin:6px 0 0}.a{white-space:pre-wrap;font-size:17px;margin:6px 0 0}
.meta{font-size:13px;color:#6A7180;margin-top:8px}
.wait{color:#5A6170}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts a,.acts button{flex:1 1 140px;min-height:50px;border-radius:12px;font-weight:700;font-size:16px;border:1.5px solid #D9D1C3;background:#fff;color:#141B2D;text-decoration:none;display:flex;align-items:center;justify-content:center;font-family:inherit;cursor:pointer}
.acts .p{background:#141B2D;color:#F6E7C1;border-color:#141B2D}
.links{display:grid;gap:8px;margin-top:10px}.links a{display:block;background:#fff;border:1px solid #E3DCCF;border-radius:12px;padding:12px 14px;color:#141B2D;text-decoration:none;font-weight:700}.links a span{display:block;font-weight:500;font-size:13.5px;color:#6A7180}
.fine{font-size:12.5px;color:#6A7180;margin-top:18px}
</style></head><body>
<header class="top"><p>상동역 롯데캐슬 시그니처</p><h1>남겨 주신 질문의 답변</h1></header>
<main class="wrap">
 <div id="box"><div class="card"><p class="wait">불러오는 중…</p></div></div>
 <div class="acts"><a class="p" id="tel" href="#">전화하기</a><button type="button" id="more">또 물어보기</button></div>
 <h2 style="font-size:17px;margin:26px 0 0">함께 보시면 좋은 화면</h2>
 <div class="links">
  <a href="../intro/?from=qa">① 단지 기본 설명<span>규모 · 입지 · 학교 · 커뮤니티 · 분양 조건</span></a>
  <a href="../1/?from=qa">② 우리 가족 집 알아보기<span>위치 · 단지 · 대출 · 내 돈을 한눈에</span></a>
  <a href="../2/?from=qa">③ 우리 가족 호실 고르는 법<span>동 · 타입 · 향 · 층을 일곱 단계로</span></a>
  <a href="../3/?from=qa">④ 나만의 시그니처 만들기<span>직접 골라 1 · 2 · 3순위 사양서 만들기</span></a>
 </div>
 <p class="fine" id="fine"></p>
</main>
<script src="../assets/ask.js" data-bottom="20" data-manual="1"></script>
<script>
(function(){
  var S=window.SIG, esc=S.esc, m=/[?&]a=([A-Za-z0-9]+)/.exec(location.search), id=m?m[1]:'';
  document.getElementById('tel').href='tel:'+S.raw; document.getElementById('tel').textContent='전화하기';
  document.getElementById('more').onclick=function(){ window.SIGASK.open(); };
  document.getElementById('fine').textContent='답변은 '+S.who+'가 드린 상담 안내이며, 금액 · 대출 · 세금은 개인별로 달라 최종 확인이 필요합니다. 자료 기준일 '+S.dataDate+' · 제공 '+S.operator;
  var box=document.getElementById('box');
  if(!id){ box.innerHTML='<div class="card"><p>답변 링크가 잘렸을 수 있습니다. 담당 상담사에게 다시 받아 주세요.</p></div>'; return; }
  S.answer(id).then(function(j){
    if(!j||!j.ok){ box.innerHTML='<div class="card"><p>'+(j&&j.why==='noapi'?'지금은 답변을 이 화면에서 볼 수 없습니다. 담당 상담사가 문자나 전화로 알려 드립니다.':'질문을 찾지 못했습니다. 담당 상담사에게 다시 받아 주세요.')+'</p></div>'; return; }
    box.innerHTML='<div class="card"><p class="lb">질문 · '+esc(j.at)+'</p><p class="q">'+esc(j.q)+'</p></div>'+
      (j.a?'<div class="card" style="border-color:#C9A961"><p class="lb">답변 · '+esc(j.who||S.who)+(j.aat?' · '+esc(j.aat):'')+'</p><p class="a">'+esc(j.a)+'</p></div>'
          :'<div class="card"><p class="wait">아직 답변을 준비하고 있습니다. 답변이 준비되면 문자나 카카오톡으로 알려 드리거나 전화 드립니다.</p></div>');
  }).catch(function(){ box.innerHTML='<div class="card"><p>답변을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.</p></div>'; });
})();
</script>
</body></html>
