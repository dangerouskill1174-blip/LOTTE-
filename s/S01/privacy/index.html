<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8">

<style>
.top{background:#16203A;color:#F4F1EA}.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:12px}.top a{color:#E3C690;text-decoration:none;font-weight:700;font-size:14px}.top .nm{font-size:13px;opacity:.8}

.pp .lead{color:var(--muted);margin-top:8px}.pp section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}

.pp table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px}.pp th,.pp td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.pp th{width:34%;color:var(--muted);font-weight:700}

<div class="top"><div class="wrap"><a href="../">← 처음으로</a><span class="nm">상동역 롯데캐슬 시그니처</span></div></div>
<main class="wrap pp" id="pp"><p class="ey">개인정보 처리방침</p><h1>개인정보를 이렇게 다룹니다</h1><p class="lead">불러오는 중…</p></main>
<script src="../assets/sig.js"></script>
<script>
(function(){
  var S=window.SIG, e=S.esc, who=S.collector, tel=S.collectorTel, cpo=S.cpo||S.collector, proc=S.processor||'';
  var ver=S.cver, ret=S.retention;
  var procRows=proc?proc.split(/\),\s*/).map(function(x,i,arr){return '<li>'+e((i<arr.length-1?x+')':x).trim())+'</li>'}).join(''):'<li>없음</li>';
  document.getElementById('pp').innerHTML=
  '<p class="ey">개인정보 처리방침</p><h1>개인정보를 이렇게 다룹니다</h1>'+
  '<p class="lead">'+e(S.site)+' 분양 상담에서 받는 개인정보는 <b>'+e(who)+'</b>(이하 \'상담사\')가 처리하는 개인정보처리자입니다. 「개인정보 보호법」 제30조에 따라 아래와 같이 알려 드립니다.</p>'+
  '<section><h2>1. 무엇을 · 왜 받나요</h2><table>'+
   '<tr><th>필수</th><td>성함, 연락처 · 요청하신 상담 화면 열람, 고르신 호실의 계약 가능 여부 회신, 분양 상담 연락</td></tr>'+
   '<tr><th>상담 중 말씀하신 것</th><td>관심 타입 · 동 · 호실, 상담 메모(말씀하신 범위 안에서만) · 맞춤 안내</td></tr>'+
   '<tr><th>선택</th><td>광고 수신 방법(문자 · 카카오톡 · 전화), 밤 9시~아침 8시 수신 여부 · 분양 소식 · 혜택 안내</td></tr>'+
   '<tr><th>자동으로 남는 것</th><td>동의 일시와 동의 문구 버전, 보내 드린 안내 화면을 여신 일시 · 동의 증빙과 후속 안내</td></tr></table>'+
   '<p class="fine">주민등록번호 등 고유식별정보와 건강 등 민감정보는 받지 않습니다. 소득 · 자산은 고객님이 말씀하신 만큼만 상담 메모에 적습니다.</p></section>'+
  '<section><h2>2. 얼마나 보관하나요</h2><ul><li>'+e(ret)+'</li><li>광고 수신 동의는 철회하실 때까지 · 2년마다 동의 여부를 다시 여쭙니다(정보통신망법 시행령 제62조의3)</li><li>보관 기간이 지나거나 삭제를 요청하시면 지체 없이 파기합니다. 다만 수신거부하신 연락처는 다시 보내지 않기 위해 수신거부 목록에만 남깁니다.</li></ul></section>'+
  '<section><h2>3. 다른 곳에 주나요</h2><p><b>제3자에게 제공하지 않습니다.</b> 시행사 · 분양대행사 · 제휴사에도 드리지 않습니다.</p></section>'+
  '<section><h2>4. 맡겨서 처리하는 곳 (위탁)</h2><ul>'+procRows+'</ul><p class="fine">맡긴 곳은 상담사가 정한 목적 안에서만 처리하며, 목적 외 이용 · 다시 맡기기 금지와 안전조치를 약속받았습니다(개인정보 보호법 제26조).</p></section>'+
  '<section><h2>5. 국외 이전</h2><table>'+
   '<tr><th>받는 곳</th><td>Google LLC · <a href="https://support.google.com/policies/contact/general_privacy_form" target="_blank" rel="noopener">개인정보 문의</a></td></tr>'+
   '<tr><th>나라</th><td>미국 등 Google 데이터센터 소재국</td></tr>'+
   '<tr><th>언제 · 어떻게</th><td>상담 등록 · 질문 · 수신거부를 보내실 때 인터넷으로 전송</td></tr>'+
   '<tr><th>항목 · 목적</th><td>위 1번 항목 · 상담 기록 저장(구글 시트)</td></tr>'+
   '<tr><th>보관 기간</th><td>위 2번과 같음</td></tr>'+
   '<tr><th>거부 방법과 결과</th><td>휴대폰 화면 등록을 하지 않으시면 됩니다. 이 경우 전화 상담이나 종이 안내로 같은 내용을 받으실 수 있습니다.</td></tr></table>'+
   '<p class="fine">계약 이행을 위한 보관 위탁으로, 개인정보 보호법 제28조의8 제1항 제3호에 따라 이 처리방침에 공개합니다.</p></section>'+
  '<section><h2>6. 고객님의 권리</h2><p>언제든 열람 · 정정 · 삭제 · 처리정지 · 동의 철회를 요청하실 수 있습니다. 아래 연락처로 말씀해 주시면 지체 없이 처리하고 결과를 알려 드립니다. 광고는 <a href="../optout/">수신거부 화면</a>에서 바로 끊을 수 있습니다.</p></section>'+
  '<section><h2>7. 안전하게 지키는 방법</h2><ul><li>상담 태블릿 자료 암호화 · 사람마다 다른 접속 코드 · 20분 자리 비움 자동 잠금</li><li>고객 정보는 담당 상담사만 볼 수 있고, 운영사와 팀장 · 본부장에게는 숫자만 보입니다</li><li>고객 정보를 다룬 기록(접속 기록)을 1년 이상 보관합니다</li><li>상담사는 개인정보 보호 교육을 마쳐야 상담 자료를 열 수 있습니다(분기 갱신)</li></ul></section>'+
  '<section><h2>8. 유출되었을 때</h2><p>유출을 알게 되면 72시간 안에 고객님께 알리고, 법이 정한 경우 개인정보보호위원회 또는 한국인터넷진흥원에 신고합니다(개인정보 보호법 제34조).</p></section>'+
  '<section><h2>9. 개인정보 보호책임자</h2><p>'+e(cpo)+' · '+e(tel)+'</p></section>'+
  '<section><h2>10. 도움 받을 수 있는 곳</h2><ul><li>개인정보분쟁조정위원회 1833-6972 · <a href="https://www.kopico.go.kr" target="_blank" rel="noopener">kopico.go.kr</a></li><li>개인정보침해신고센터 118 · <a href="https://privacy.kisa.or.kr" target="_blank" rel="noopener">privacy.kisa.or.kr</a></li><li>대검찰청 1301 · 경찰청 182</li></ul></section>'+
  '<p class="fine" style="margin-top:16px">시행일 '+e(S.dataDate)+' · 동의 문구 '+e(ver)+' · 상담 시스템 제공 '+e(S.operator)+'</p>';
})();
</script>
</body></html>
