    cl.innerHTML=S.cands.length?S.cands.map((x,i)=>{const k=calc(x);return `<div class="cand"><span><b>${i+1}순위 · ${x.dong}동 ${esc(x.unit)||x.ho+'호'} ${x.type}</b> · ${esc(x.floor)?esc(x.floor)+'층':bandName(k.l,k.b)} · ${eok(k.P)}</span><span style="display:flex;gap:6px">${i?`<button class="btn btn-s" style="padding:6px 10px" data-up="${i}">위로</button>`:''}<button class="btn btn-s" style="padding:6px 10px" data-del="${i}">빼기</button></span></div>`}).join(''):(S.ho&&S.band?'<p class="sub">아직 담은 후보가 없어 지금 고른 호실로 확인서를 만듭니다. 결과 화면에서 ‘1순위로 담기’를 누르면 2 · 3순위까지 넣어 비교할 수 있습니다.</p>':'<p class="sub">아직 고른 호실이 없습니다. 처음부터 골라 주세요.</p>');
    n.querySelector('#sheet').innerHTML=sheetHTML()||'<p class="sub" style="padding:12px">호실을 고르면 확인서가 여기에 나타납니다.</p>';
  };
  refresh();
  [['ic','cust'],['ia','agent'],['ip','phone']].filter(([id])=>n.querySelector('#'+id)).forEach(([id,k])=>n.querySelector('#'+id).addEventListener('input',e=>{S.info[k]=e.target.value; save(); n.querySelector('#sheet').innerHTML=sheetHTML();}));
  return n;
}

// ---------- 직원 화면 ----------
let DB=null, USER=null, CAN=false, SHOWV=false, STAFF_DRAFT=null;
function staffView(){
  const d=STAFF_DRAFT;
  const dongs=['101','102','103','104','105','106','107'];
  const cellB=(l,b)=>{ if(!bandExists(l,b)) return `<td><button class="cell x" disabled aria-label="없음">·</button></td>`; const s=(d.lines[key(l)]||'yyyyyyy')[b.i]; const c=s==='n'?'n':(s==='u'?'u':'y'); return `<td><button class="cell ${c}" data-cell="${key(l)}|${b.i}" aria-label="${key(l)} ${b.name} ${c}">${c==='y'?'○':(c==='n'?'✕':'?')}</button></td>`; };
  const n=el(`<section class="step"><p class="eyebrow">직원 전용 · 고객에게 보여 주지 않습니다</p><h2 class="q">현황판 반영</h2>
  <p class="sub">칸을 누를 때마다 ○ 상담 가능 → ✕ 계약 완료(고객 화면에서 숨김) → ? 확인 필요(보이되 ‘현장 확인’) 순서로 바뀝니다. 층 구간에 한 세대라도 남아 있으면 ○로 둡니다. 저장하면 이 링크를 연 모든 화면에 바로 반영됩니다.</p>
  <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:end"><label class="field" for="asof">현황판 기준일<input id="asof" value="${esc(d.asof)}" placeholder="2026-11-16"></label><button class="btn btn-g" data-act="stsave">저장</button><button class="btn btn-s" data-act="stexit">고객 화면으로</button></div>
  ${DB?'':'<p class="note" style="color:var(--rust)">이 화면에서는 저장소에 연결되지 않아 저장할 수 없습니다.</p>'}
  ${dongs.map(dn=>`<h3 class="q2" style="margin-top:18px">${dn}동</h3><div class="stf-wrap"><table class="stf"><tr><th>호 (라인당 세대수)</th>${BANDS.map((b,i)=>`<th>${b.name.replace('40층 이상','40~')}<br><span style="font-weight:400;color:var(--muted)">${['1','1','4','10','6','13','9~10'][i]}</span></th>`).join('')}</tr>${L.filter(l=>l.dong===dn).map(l=>`<tr><th>${l.ho}호 ${l.type}</th>${BANDS.map(b=>cellB(l,b)).join('')}</tr>`).join('')}</table></div>`).join('')}
  <p class="note">마지막 저장: ${esc(ASOF)||'—'}</p></section>`);
  return n;
}
function pinView(){
  const A=$('#app'); A.innerHTML='';
  const n=el(`<section class="step"><p class="eyebrow">직원 전용</p><h2 class="q">비밀번호를 넣어 주세요</h2><p class="sub">현황판 화면은 고객에게 보여 주지 않습니다.</p><div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:end"><label class="field" for="pin">비밀번호<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><button class="btn btn-p" data-act="pinok">열기</button><button class="btn btn-s" data-act="stexit">취소</button></div></section>`);
  A.appendChild(n); n.querySelector('#pin').focus();
}

// ---------- 이벤트 ----------
document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.cell){ const [k,i]=d.cell.split('|'); const s=(STAFF_DRAFT.lines[k]||'yyyyyyy').split(''); const cur=s[+i]; s[+i]=cur==='y'||cur==='-'?'n':(cur==='n'?'u':'y'); STAFF_DRAFT.lines[k]=s.join(''); b.className='cell '+s[+i]; b.textContent=s[+i]==='y'?'○':(s[+i]==='n'?'✕':'?'); return; }
  if(d.house){ S.houses=+d.house; if(S.houses>=2 && S.loan===6) S.loan=4; S.dong=S.type=S.ho=S.band=null; render(); return; }
  if(d.loan){ if(S.houses!=null && S.houses>=2 && +d.loan===6){toast('다주택은 잔금대출이 제한되어 모든 호실로 봅니다'); S.loan=4;} else S.loan=+d.loan; S.dong=S.type=S.ho=S.band=null; render(); return; }
  if(d.prior){ S.prior=S.prior.includes(d.prior)?S.prior.filter(x=>x!==d.prior):[...S.prior,d.prior]; render(); return; }
  if(d.dong){ if(b.classList.contains('dim')){toast('이 동은 지금 조건에 맞는 호실을 상담사가 따로 안내합니다');} S.dong=d.dong; S.type=S.ho=S.band=null; render(); return; }
  if(d.type){ S.type=d.type; S.ho=S.band=null; render(); return; }
  if(d.ho){ S.ho=+d.ho; S.band=null; render(); return; }
  if(d.band){ S.band=d.band; render(); return; }
  if(d.go){ go(+d.go); return; }
  if(d.up){ const i=+d.up; [S.cands[i-1],S.cands[i]]=[S.cands[i],S.cands[i-1]]; save(); render(); return; }
  if(d.del){ S.cands.splice(+d.del,1); save(); render(); return; }
  const a=d.act;
  if(a==='next') go(S.step+1);
  if(a==='back') go(Math.max(0,S.step-1));
  if(a==='again'){ S.type=S.ho=S.band=null; S.confirm={floor:'',unit:''}; go(2); }
  if(a==='keep'){ if(S.cands.length>=3){toast('후보는 3개까지 담을 수 있습니다');return;} S.cands.push({dong:S.dong,ho:S.ho,type:S.type,band:S.band,floor:S.confirm.floor,unit:S.confirm.unit}); save(); toast(S.cands.length+'순위로 담았습니다'); render(); }
  if(a==='clear'){ S.cands=[]; save(); render(); }
  if(a==='dl') saveHTML();
  if(a==='png') savePNG(b);
  if(a==='req'){ const L=SIG.lead(); if(!L) return; b.disabled=true; await SIG.submit({name:L.name,tel:L.tel,interest:d.req||'시뮬레이터 상담 요청',route:'시뮬레이터'}); b.disabled=false; b.textContent='요청 완료 ✓'; toast(`${CONTACT.who}에게 확인 요청을 보냈습니다. 곧 연락드리겠습니다`); }
  if(a==='pinok'){ const v=$('#pin').value; if(v!==PIN){toast('비밀번호가 맞지 않습니다');return;} STAFF_DRAFT={asof:ASOF||new Date().toISOString().slice(0,10),lines:JSON.parse(JSON.stringify(AV||{}))}; S.staff=true; render(); window.scrollTo({top:0}); }
  if(a==='stexit'){ S.staff=false; render(); }
  if(a==='stsave'){ if(!DB){toast('저장소에 연결되지 않았습니다');return;} STAFF_DRAFT.asof=$('#asof').value.trim(); b.disabled=true;
    try{ await DB.doc('board/current').set({asof:STAFF_DRAFT.asof,lines:STAFF_DRAFT.lines}); toast('현황판을 저장했습니다'); }
    catch(err){ toast('저장하지 못했습니다'+(err&&err.code?' ('+err.code+')':'')); }
    b.disabled=false; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='pin') $('[data-act="pinok"]').click(); });
const PIN='1859';

// ---------- 저장 ----------
async function dataURL(src){ try{ const r=await fetch(src); const bl=await r.blob(); return await new Promise(res=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(src); fr.readAsDataURL(bl);}); }catch(e){ return src; } }
async function getDL(){ return {save: async ({filename,data})=>{ const blob = data instanceof Blob ? data : new Blob([data],{type:'text/html;charset=utf-8'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); return {status:'saved'}; }}; }
function showImg(blob){ const u=URL.createObjectURL(blob); const o=document.createElement('div'); o.className='imgov'; o.innerHTML=`<div class="imgov-in"><p><b>사양서 이미지</b> · 휴대폰은 이미지를 길게 눌러 저장하세요</p><img src="${u}" alt="우리 가족 시그니처 사양서"><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><a class="btn btn-g" style="text-decoration:none" href="${u}" download="${fileBase()}.png">파일로 저장</a><button class="btn btn-s" type="button">닫기</button></div></div>`; o.querySelector('button').onclick=()=>o.remove(); o.addEventListener('click',e=>{ if(e.target===o) o.remove(); }); document.body.appendChild(o); }
function fileBase(){ const list=listForSheet(); const c=calc(list[0]); return `우리가족시그니처사양서_${c.l.dong}동_${c.l.type}`; }
async function saveHTML(){
  let body=sheetHTML(); if(!body){toast('먼저 호실을 골라 주세요');return;}
  const t=listForSheet()[0].type; body=body.replace(`plans/${t}.jpg`, await dataURL(`plans/${t}.jpg`));
  const doc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>우리 가족 시그니처 사양서</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap"><style>body{margin:0;background:#fff}</style></head><body>${body}</body></html>`;
  const dl=await getDL(); if(!dl){ toast('이 화면에서는 저장할 수 없습니다. 확인서를 화면으로 보여 주세요'); return; }
  try{ await dl.save({filename:fileBase()+'.html',data:doc}); toast('저장했습니다. 파일을 열어 인쇄하세요'); }
  catch(err){ if(err&&err.code==='declined') return; toast('저장하지 못했습니다'); }
}
function loadH2C(){ return new Promise((res,rej)=>{ if(window.html2canvas) return res(window.html2canvas); const s=document.createElement('script'); s.src='../assets/html2canvas.min.js'; s.onload=()=>res(window.html2canvas); s.onerror=rej; document.head.appendChild(s); }); }
async function savePNG(btn){
  const sh=$('#sh'); if(!sh){toast('먼저 호실을 골라 주세요');return;}
  btn.disabled=true; const old=btn.textContent; btn.textContent='만드는 중…';
  try{
    const h2c=await loadH2C(); if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const cv=await h2c(sh,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123,windowWidth:1100});
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    showImg(blob);
  }catch(err){ if(!(err&&err.code==='declined')) toast('이미지를 만들지 못했습니다. HTML 저장을 이용해 주세요'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

// ---------- 현황판 연결 ----------
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    DB=db; USER=user;
    CAN = user ? await user.canEdit() : false;

    if(db && CAN){
      db.doc('board/current').onSnapshot(snap=>{
        if(snap.exists){ const v=snap.data(); AV=v.lines||null; ASOF=v.asof||''; }
        if(!S.staff && [2,3,4,5].includes(S.step)) render();
      },()=>{});
    }
  }catch(e){}
})();
render();
</script>
